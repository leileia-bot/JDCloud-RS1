# JDCloud AX1800 Pro（ipq6000）自用精简固件
# 底座：immortalwrt master（6.18 内核，无 NSS 补丁）
name: Build JDCloud-RS

on:
  workflow_dispatch:
    inputs:
      ebpf:
        description: '注入 eBPF/BTF 内核符号'
        type: boolean
        default: true

env:
  WRT_SOURCE: immortalwrt/immortalwrt
  WRT_BRANCH: master
  WRT_NAME: JDCloud-RS
  WRT_SSID: "✈"
  WRT_WORD: "12345678"
  WRT_IP: "192.168.1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq purge firefox
          sudo apt-get -yqq update
          sudo apt-get -yqq install --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache cmake cpio curl \
            device-tree-compiler dos2unix file flex gawk gettext git jq libelf-dev \
            libncurses-dev libssl-dev lld llvm ninja-build patch perl pkgconf python3 \
            python3-dev python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt && sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Clone Source
        id: clone
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH https://github.com/$WRT_SOURCE ./wrt/
          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "CACHE_KEY=wrt-${{env.WRT_SOURCE}}-${{env.WRT_BRANCH}}-qualcommax-ipq60xx-$WRT_HASH" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        uses: actions/cache/restore@main
        with:
          key: ${{env.CACHE_KEY}}
          restore-keys: wrt-${{env.WRT_SOURCE}}-${{env.WRT_BRANCH}}-qualcommax-ipq60xx-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Feeds
        run: |
          cd ./wrt/
          # 去掉 video feed：官方快照的 video 索引长期截断，会导致固件里 apk update 报错
          sed -i '/^src-git video /d' feeds.conf.default
          # 插件源码源（同树编译，产出 apk 与本固件内核匹配）
          grep -q 'openwrt-daede' feeds.conf.default || echo "src-git daede https://github.com/kenzok8/openwrt-daede.git^main" >> feeds.conf.default
          grep -q 'vernesong/OpenClash' feeds.conf.default || echo "src-git openclash https://github.com/vernesong/OpenClash.git^master" >> feeds.conf.default
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Files Overlay
        run: |
          cd ./wrt/
          mkdir -p ./files
          cp -rf $GITHUB_WORKSPACE/files/. ./files/
          find ./files -type f

      - name: Custom Settings
        run: |
          cd ./wrt/

          cat $GITHUB_WORKSPACE/Config/target.txt >> .config

          # 主机名 / 默认 IP
          CFG_FILE="./package/base-files/files/bin/config_generate"
          sed -i "s/192\.168\.[0-9]*\.[0-9]*/$WRT_IP/g" $CFG_FILE
          sed -i "s/hostname='.*'/hostname='$WRT_NAME'/" $CFG_FILE

          # 默认 WiFi 名称/密码（兜底脚本之外再设一次）
          WIFI_UC="./package/network/config/wifi-scripts/files/lib/wifi/mac80211.uc"
          if [ -f "$WIFI_UC" ]; then
            sed -i "s/|| \"ImmortalWrt\"/|| \"$WRT_SSID\"/; s/|| \"\"/|| \"$WRT_WORD\"/" "$WIFI_UC"
            echo "--- wifi defaults ---"
            grep -nE "ssid=|key=" "$WIFI_UC" | head -5
          fi

          # eMMC 设备定义 + eMMC DTS 段（移植 VIKINGYFY/immortalwrt@owrt）
          # 产出 factory.bin：走 U-Boot 刷写才会重建 eMMC 分区布局，overlay 才能落到 eMMC
          $GITHUB_WORKSPACE/.github/scripts/patch-emmc.sh .

          # 硬改 12M 内核槽
          MK=target/linux/qualcommax/image/ipq60xx.mk
          sed -i '/define Device\/jdcloud_re-ss-01/,/TARGET_DEVICES += jdcloud_re-ss-01/ s/KERNEL_SIZE := 6144k/KERNEL_SIZE := 12288k/' "$MK"
          echo "--- kernel slot ---"
          sed -n '/define Device\/jdcloud_re-ss-01/,/TARGET_DEVICES += jdcloud_re-ss-01/p' "$MK"

          # eBPF/BTF 内核符号
          if [ "${{ inputs.ebpf }}" = "true" ]; then
            $GITHUB_WORKSPACE/.github/scripts/patch-kernel-ebpf.sh
            # 新符号会冒出 (NEW) 子项，非交互 kconfig 会卡死，补一次 olddefconfig
            KDEF=include/kernel-defaults.mk
            grep -q 'jdrs-olddefconfig' "$KDEF" || \
              sed -i '/\$(_SINGLE) \[ -d \$(LINUX_DIR)\/user_headers \] ||/i\	$(KERNEL_MAKE) olddefconfig >/dev/null 2>&1 || true # jdrs-olddefconfig' "$KDEF"
            grep -n 'jdrs-olddefconfig' "$KDEF"
          fi

          make defconfig -j$(nproc)
          echo "--- check target ---"
          grep -E 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01|CONFIG_PACKAGE_luci=y|CONFIG_PACKAGE_bpftool' .config || true

      - name: Download Packages
        run: |
          cd ./wrt/
          make download -j$(nproc) || true

      - name: Compile Firmware
        run: |
          cd ./wrt/
          make -j$(nproc) || make -j1 V=s

      - name: Save Build Cache
        if: success() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@main
        with:
          key: ${{env.CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Collect Images
        run: |
          cd ./wrt/
          mkdir -p upload
          WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")
          echo "WRT_DATE=$WRT_DATE" >> $GITHUB_ENV
          cp -f ./.config upload/Config-JDCloud-RS-$WRT_DATE.txt
          find ./bin/targets/qualcommax/ipq60xx/ -maxdepth 1 -type f \
            \( -name "*.bin" -o -name "*.itb" -o -name "*.tar" -o -name "*.manifest" \) \
            -exec cp -f {} upload/ \;
          ls -l upload/
          echo "--- factory image check ---"
          for F in upload/*factory*.bin; do
            [ -e "$F" ] || { echo "!! 没有 factory.bin"; continue; }
            ls -l "$F"
            python3 -c "import sys,re;d=open(sys.argv[1],'rb').read();m=re.search(b'hsqs',d);print('factory bytes:',len(d));print('rootfs offset:',m.start(),'(%.2f MiB)'%(m.start()/1048576)) if m else print('no squashfs magic')" "$F"
          done
          echo "--- kernel size check ---"
          BIN=$(ls upload/*sysupgrade*.bin 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then
            python3 -c "import sys,re;d=open(sys.argv[1],'rb').read();m=re.search(b'hsqs',d);print('image bytes:',len(d));print('rootfs offset:',m.start(),'(%.2f MiB)'%(m.start()/1048576)) if m else print('no squashfs magic')" "$BIN"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: images-${{env.WRT_DATE}}
          path: ./wrt/upload/
          retention-days: 7

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: JDCloud-RS-${{env.WRT_DATE}}
          files: ./wrt/upload/*
          body: |
            自用精简固件（无 NSS，含 eBPF/BTF）
            源码：${{env.WRT_SOURCE}}@${{env.WRT_BRANCH}} ${{env.WRT_HASH}}
            登录：${{env.WRT_IP}}
            WiFi：${{env.WRT_SSID}} / ${{env.WRT_WORD}}
            内核槽：12288k
