# SPDX-License-Identifier: MIT
# 纯有线固件：整机不起无线（DTS 走 nowifi，无线驱动/固件/用户态全部剔除）

name: AX1800 纯有线（无WiFi）

on:
  #手动编译
  workflow_dispatch:
    inputs:
      SOURCE:
        description: '源码仓库（owner/repo）'
        default: 'VIKINGYFY/immortalwrt'
        required: true
        type: string
      BRANCH:
        description: '源码分支'
        default: 'owrt'
        required: true
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: true
        required: true
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{inputs.SOURCE}}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置：固定走纯有线配置
      WRT_CONFIG: IPQ60XX-WIFI-NO
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: JDCloud-RS
      #默认WIFI名称（纯有线版本不生效，保留字段以兼容核心）
      WRT_SSID: ✈
      #默认WIFI密码（同上）
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.1.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{inputs.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{inputs.SOURCE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
